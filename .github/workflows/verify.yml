# Every check a change must pass (RULES.md R-PROC-1), on each platform and
# each Node.js release the driver supports (D3, D4), plus coverage against
# its floor (R-COV-2). `npm ci` installs the development dependencies the
# lock file pins.
#
# The live tests (R-TEST-8) run on Linux alone, against the nightly image
# run by test/server/server.ts with the host's network, its certificates
# made for the run. macOS and Windows runners have no Linux container
# engine and no turboreld, so there the live tests skip, as they do
# wherever TURBOREL_TEST_SERVER is not set.
name: verify

# A pull request is checked once, through pull_request, and main again once
# it is merged. Pushing a branch with an open pull request starts no second
# set of the same checks.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its checks still running.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NIGHTLY: ghcr.io/turborel/turborel:nightly

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the development dependencies
        run: npm ci
      - name: Take the nightly server
        if: runner.os == 'Linux'
        run: |
          docker pull "$NIGHTLY"
          echo "TURBOREL_TEST_SERVER=docker:$NIGHTLY" >> "$GITHUB_ENV"
      - name: Every check
        timeout-minutes: 30
        run: npm run verify

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the development dependencies
        run: npm ci
      - name: Take the nightly server
        run: |
          docker pull "$NIGHTLY"
          echo "TURBOREL_TEST_SERVER=docker:$NIGHTLY" >> "$GITHUB_ENV"
      - name: Coverage, against its floor, the live tests among them
        run: npm run coverage
