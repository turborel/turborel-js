# Kinds
- name: "bug"
  color: "#d73a4a"
  description: "The driver fails, crashes, hangs, leaks or returns a wrong value"
- name: "conformance"
  color: "#5c282b"
  description: "A departure from the protocol spec or from turborel-client"
- name: "performance"
  color: "#fbca04"
  description: "Slower than it was or should be, or too much memory"
- name: "feature"
  color: "#a2eeef"
  description: "Something the driver should do that it does not"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"

# Impact
- name: "impact/wrong-result"
  color: "#b60205"
  description: "A wrong value, read or sent"
- name: "impact/crash"
  color: "#b60205"
  description: "A crash, an uncaught exception or an unhandled rejection"
- name: "impact/hang"
  color: "#b60205"
  description: "A hang, or a connection never released"
- name: "impact/regression"
  color: "#b60205"
  description: "Worked, or was faster, at an earlier commit"

# Areas
- name: "area/codec"
  color: "#c5def5"
  description: "Frames, fields, types and values, the tail, JSON, compression: src/codec/"
- name: "area/transport"
  color: "#c5def5"
  description: "TCP, Unix sockets, named pipes, timeouts: src/transport/"
- name: "area/auth"
  color: "#c5def5"
  description: "Mechanisms, SCRAM and its key cache: src/auth/"
- name: "area/tls"
  color: "#c5def5"
  description: "TLS, its modes and channel binding: src/tls/"
- name: "area/session"
  color: "#c5def5"
  description: "Hello, Ready, status, notices, cancel, terminate, ping, reset: src/session/"
- name: "area/statements"
  color: "#c5def5"
  description: "Queries, prepared statements, cursors, describe: src/statements/"
- name: "area/lobs"
  color: "#c5def5"
  description: "Large objects by locator, and their streams: src/lobs/"
- name: "area/copy"
  color: "#c5def5"
  description: "Copy, import and export: src/copy/"
- name: "area/settings"
  color: "#c5def5"
  description: "The URI, options, environment, service and password files, hosts and roles: src/settings/"
- name: "area/pipeline"
  color: "#c5def5"
  description: "Pipelines: src/pipeline/"
- name: "area/pool"
  color: "#c5def5"
  description: "Pools and the SQL-agent: src/pool/"
- name: "area/api"
  color: "#c5def5"
  description: "The package's exports, its error type and the standard API: src/index.ts, src/error.ts, src/api/"
- name: "area/test"
  color: "#c5def5"
  description: "The live tests' server setup and shared fixtures: test/server/, test/support/"
- name: "area/doc"
  color: "#c5def5"
  description: "doc/, README.md, RULES.md, CONFORMANCE.md, TODO.md, AGENTS.md, CONTRIBUTING.md"
- name: "area/ci"
  color: "#c5def5"
  description: "The workflows, issue forms and labels in .github/"
- name: "area/build"
  color: "#c5def5"
  description: "The package manifest, the checks tool, compiler, lint, format and coverage configuration, and the hook"
- name: "dependencies"
  color: "#0366d6"
  description: "A development dependency or the toolchain changes (RULES.md R-DEP)"

# Triage
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
