name: Conformance
description: The driver departs from the protocol spec or from turborel-client.
labels: ["conformance"]
body:
  - type: markdown
    attributes:
      value: |
        Check CONFORMANCE.md first: a row marked "not yet" is open work, not a departure.
        The driver follows turborel's native protocol, version 1 (`doc/client/05-protocol.md` in turborel), and matches turborel-client. Where the two differ, turborel-client's code is right.
  - type: dropdown
    id: reference
    attributes:
      label: Departs from
      options:
        - The protocol spec (doc/client/05-protocol.md)
        - turborel-client's behaviour
        - turborel-client's documentation (doc/client/02-library.md or 02-library-connections.md)
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: The section
      description: Its heading, as printed, e.g. "Frames", "Compressed frames", "Pipelines".
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What it says
      description: Quote the passage, or name the code of turborel-client that does it.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Program
      description: The smallest program that shows the departure, with the frames sent or received if you have them.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it requires
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the driver does
      description: Its result, or its error's SQLCODE, SQLSTATE and message.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "The driver's commit, `git rev-parse --short=12 HEAD`, and the server's version"
    validations:
      required: true
