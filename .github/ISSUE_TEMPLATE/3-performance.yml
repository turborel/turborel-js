name: Performance
description: The driver is slower than it was, or than it should be, or takes too much memory.
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: Numbers, not impressions. Put `[REGRESSION]` first in the title if an earlier commit was faster.
  - type: textarea
    id: summary
    attributes:
      label: What is slow
      description: The workload, and what it costs (time, throughput, memory, connections), against what you expected and why, e.g. against turborel-client on the same server.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The program, the schema, how much data, and how many connections at once.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: measured
    attributes:
      label: Measurements
      description: What you measured and how, with several runs.
      render: text
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If it was faster before, give the last good commit and, if you ran `git bisect`, the first bad one.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "The driver's commit, `git rev-parse --short=12 HEAD`, and the server's version"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The Node.js version, the platform, processor, cores and memory, and the network between the program and the server.
    validations:
      required: true
